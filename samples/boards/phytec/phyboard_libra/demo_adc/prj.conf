# GPIO (fan output)
CONFIG_GPIO=y

# ADC (MCP3208 sur SPI)
CONFIG_ADC=y
CONFIG_ADC_MCP320X=y
CONFIG_SPI=y

# Régulateur (vin-supply du MCP3208)
CONFIG_REGULATOR=y

# I2C + LED (PCA9633)
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_PCA9633=y

# printf() (utilisé dans i2c_setup_rgb, adc_setup, main)
CONFIG_PICOLIBC=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_STM32=y