# CONFIG_KERNEL_BIN_NAME="zephyr_openamp_demo_libra"
CONFIG_PRINTK=y
CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y

# Test Ecran SPI
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_NUNCHUK=y
CONFIG_INPUT_NUNCHUK_ACCELERATION=y

# --- GPIO (wake up) ---
CONFIG_GPIO=y

#Led
CONFIG_LED=y
CONFIG_PCA9633=y

CONFIG_I2C_SHELL=y
