

# --- Console / sortie des logs ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# --- I2C ---
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
# CONFIG_I2C_DUMP_MESSAGES=y

# --- LED PCA9633 ---
CONFIG_LED=y
CONFIG_PCA9633=y

# --- Nunchuk ---
CONFIG_INPUT=y
CONFIG_INPUT_NUNCHUK=y
CONFIG_INPUT_NUNCHUK_ACCELERATION=y

# --- Analyse des threads ---
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_PRINTK=y