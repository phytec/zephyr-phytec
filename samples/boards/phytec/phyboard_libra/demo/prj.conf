# --- Base ---
CONFIG_PRINTK=y
CONFIG_IPM=y
# CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=16384
# CONFIG_LOG=y

# --- I2C + LED (PCA9633) ---
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_PCA9633=y

# --- Écran SPI (ILI9341) + DMA ---
CONFIG_SPI=y
CONFIG_SPI_STM32_DMA=y
CONFIG_DMA_STM32U5=y
CONFIG_DISPLAY=y


# --- LVGL ---
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_COLOR_16_SWAP=y

# --- LVGL piles ---
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_FLUSH_THREAD=n
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_SIZE=8

# Piles élargies (nécessaire, sans ça crash silencieux avant boot)
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=n

# --- GPIO (wake up) ---
CONFIG_GPIO=y

# --- Nunchuk ---
CONFIG_INPUT=y
CONFIG_INPUT_LOG_LEVEL_OFF=y
CONFIG_INPUT_NUNCHUK=y
CONFIG_INPUT_NUNCHUK_ACCELERATION=y

# --- OpenAmp ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n

# --- Remap DDR/RETRAM ---
CONFIG_CODE_DATA_RELOCATION=y

# CONFIG_LOG_MODE_IMMEDIATE=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y
