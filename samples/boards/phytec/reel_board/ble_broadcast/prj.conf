# --- reel_board BLE color-sync + sensor dashboard demo ---

# BLE: connectionless broadcaster + observer (advertise our color, scan for others)
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="reel sync"
CONFIG_BT_RX_STACK_SIZE=4096
# Note: the e-paper SPI is moved to DMA (nordic,nrf-spim) via the board overlay
# so a refresh never hogs the CPU long enough to delay a BLE radio-event
# prepare. That keeps advertising+scanning always on for low-latency color sync.

# User button via the input subsystem (gpio-keys node in the board DTS)
CONFIG_GPIO=y
CONFIG_INPUT=y

# Sensors
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_TI_HDC=y
CONFIG_FXOS8700=y
CONFIG_FXOS8700_MODE_ACCEL=y
CONFIG_APDS9960=y
CONFIG_APDS9960_ENABLE_ALS=y

# E-paper display through the character framebuffer (CFB) subsystem
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Console + floating point formatting for sensor values
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# The display is rendered from the system workqueue; give it room
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
